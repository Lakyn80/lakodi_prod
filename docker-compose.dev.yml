services:
  lakodi-backend-dev:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    restart: unless-stopped
    depends_on:
      - lakodi-redis
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/app.db}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/data/uploads}
      REDIS_URL: ${REDIS_URL:-redis://lakodi-redis:6379/0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8090,http://127.0.0.1:8090,http://localhost:3000,http://127.0.0.1:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-lakodi@seznam.cz}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_RECOVERY_TOKEN: ${ADMIN_RECOVERY_TOKEN:-}
      ADMIN_RECOVERY_EMAILS: ${ADMIN_RECOVERY_EMAILS:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-zmente-na-nahodny-retezec}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ADMIN_FROM_EMAIL: ${ADMIN_FROM_EMAIL:-Lakodi <onboarding@resend.dev>}
      ADMIN_RECOVERY_BASE_URL: ${ADMIN_RECOVERY_BASE_URL:-http://localhost:8090}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-0}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-true}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      ARES_PROVIDER: ${ARES_PROVIDER:-mock}
      # AI ↔ Lakodi S2S (AI connector → Lakodi internal accounting API)
      AI_ACCOUNTING_SERVICE_TOKEN_SECRET: ${AI_ACCOUNTING_SERVICE_TOKEN_SECRET:-}
      AI_ACCOUNTING_EXPECTED_TENANT_ID: ${AI_ACCOUNTING_EXPECTED_TENANT_ID:-}
      AI_ACCOUNTING_ALLOWED_KEY_ID: ${AI_ACCOUNTING_ALLOWED_KEY_ID:-}
      AI_ACCOUNTING_TOKEN_ISSUER: ${AI_ACCOUNTING_TOKEN_ISSUER:-ai-agent-accounting}
      AI_ACCOUNTING_TOKEN_AUDIENCE: ${AI_ACCOUNTING_TOKEN_AUDIENCE:-lakodi-internal-accounting}
      AI_ACCOUNTING_MAX_TOKEN_TTL_SECONDS: ${AI_ACCOUNTING_MAX_TOKEN_TTL_SECONDS:-300}
      AI_ACCOUNTING_CLOCK_SKEW_SECONDS: ${AI_ACCOUNTING_CLOCK_SKEW_SECONDS:-120}
      # Lakodi BFF → AI platform (host JWT mint)
      AI_AUTH_TOKEN_ISSUER: ${AI_AUTH_TOKEN_ISSUER:-lakodi-host}
      AI_AUTH_TOKEN_AUDIENCE: ${AI_AUTH_TOKEN_AUDIENCE:-ai-agent-accounting}
      AI_AUTH_KEY_ID: ${AI_AUTH_KEY_ID:-}
      AI_AUTH_SIGNING_SECRET: ${AI_AUTH_SIGNING_SECRET:-}
      AI_AUTH_TENANT_ID: ${AI_AUTH_TENANT_ID:-}
      AI_AUTH_TOKEN_TTL_SECONDS: ${AI_AUTH_TOKEN_TTL_SECONDS:-300}
      AI_AUTH_DEFAULT_SCOPES: ${AI_AUTH_DEFAULT_SCOPES:-ai.chat,lakodi.invoices.read,lakodi.payments.read,lakodi.customers.read}
      AI_AGENT_BASE_URL: ${AI_AGENT_BASE_URL:-http://ai-agent-accounting-api:8000}
      AI_AGENT_TIMEOUT_SECONDS: ${AI_AGENT_TIMEOUT_SECONDS:-60}
    ports:
      - "8016:8016"
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend:ro
      - ./data:/app/data
    networks:
      default: {}
      lakodi-ai-shared:
        aliases:
          - lakodi-backend-dev

  lakodi-frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - lakodi-backend-dev
      - lakodi-redis
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8016}
      API_INTERNAL_URL: http://lakodi-backend-dev:8016
      NEXT_PUBLIC_ACCOUNTING_NEW_ENABLED: "true"
    ports:
      - "8090:8080"
    volumes:
      - ./frontend:/app
      - lakodi_frontend_node_modules:/app/node_modules
      - lakodi_frontend_next:/app/.next

networks:
  lakodi-ai-shared:
    external: true
    name: lakodi-ai-shared
