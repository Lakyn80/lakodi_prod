name: CI

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend testy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalace backend závislostí
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn python-multipart pillow pillow-heif sqlalchemy resend passlib "bcrypt==4.0.1" pytest httpx reportlab redis

      - name: Spuštění backend testů
        run: pytest backend/tests -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalace frontend závislostí
        run: npm ci

      - name: Build frontendu
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8016
        run: npm run build
