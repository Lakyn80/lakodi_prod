name: Backend CI (Docker)

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: |
          cd lakodi-auto-studio
          docker compose build

      - name: Run tests in Docker
        run: |
          cd lakodi-auto-studio
          docker compose run --rm lakodi-backend-test
