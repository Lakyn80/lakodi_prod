name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  determine-context:
    name: Určení deploy kontextu
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      branch_tag: ${{ steps.context.outputs.branch_tag }}
      image_tag: ${{ steps.context.outputs.image_tag }}
      backend_image: ${{ steps.context.outputs.backend_image }}
      frontend_image: ${{ steps.context.outputs.frontend_image }}
      publish_latest: ${{ steps.context.outputs.publish_latest }}
      head_sha: ${{ steps.context.outputs.head_sha }}
      secret_prefix: ${{ steps.context.outputs.secret_prefix }}
    steps:
      - id: context
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          branch="${{ github.event.workflow_run.head_branch }}"
          image_tag="sha-${{ github.event.workflow_run.head_sha }}"
          publish_latest="false"

          if [[ "${branch}" == "develop" ]]; then
            branch_tag="develop"
            secret_prefix="STAGING"
          elif [[ "${branch}" == "main" ]]; then
            branch_tag="main"
            secret_prefix="PRODUCTION"
            publish_latest="true"
          else
            echo "Nepodporovaná branch ${branch}." >&2
            exit 1
          fi

          {
            echo "branch_tag=${branch_tag}"
            echo "image_tag=${image_tag}"
            echo "backend_image=ghcr.io/${owner}/lakodi-backend"
            echo "frontend_image=ghcr.io/${owner}/lakodi-frontend"
            echo "publish_latest=${publish_latest}"
            echo "head_sha=${{ github.event.workflow_run.head_sha }}"
            echo "secret_prefix=${secret_prefix}"
          } >> "${GITHUB_OUTPUT}"

  build-backend-image:
    name: Build a push backend image
    runs-on: ubuntu-latest
    needs:
      - determine-context
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.determine-context.outputs.head_sha }}

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Přihlášení do GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata backend image
        id: backend-meta
        shell: bash
        run: |
          tags="${{ needs.determine-context.outputs.backend_image }}:${{ needs.determine-context.outputs.image_tag }}"
          tags="${tags}"$'\n'"${{ needs.determine-context.outputs.backend_image }}:${{ needs.determine-context.outputs.branch_tag }}"
          if [[ "${{ needs.determine-context.outputs.publish_latest }}" == "true" ]]; then
            tags="${tags}"$'\n'"${{ needs.determine-context.outputs.backend_image }}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build a push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile.prod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          cache-from: type=gha,scope=backend-prod
          cache-to: type=gha,mode=max,scope=backend-prod

  build-frontend-image:
    name: Build a push frontend image
    runs-on: ubuntu-latest
    needs:
      - determine-context
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.determine-context.outputs.head_sha }}

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Přihlášení do GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata frontend image
        id: frontend-meta
        shell: bash
        run: |
          tags="${{ needs.determine-context.outputs.frontend_image }}:${{ needs.determine-context.outputs.image_tag }}"
          tags="${tags}"$'\n'"${{ needs.determine-context.outputs.frontend_image }}:${{ needs.determine-context.outputs.branch_tag }}"
          if [[ "${{ needs.determine-context.outputs.publish_latest }}" == "true" ]]; then
            tags="${tags}"$'\n'"${{ needs.determine-context.outputs.frontend_image }}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build a push frontend image
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets[format('{0}_NEXT_PUBLIC_API_URL', needs.determine-context.outputs.secret_prefix)] }}
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile.prod
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          cache-from: type=gha,scope=frontend-prod
          cache-to: type=gha,mode=max,scope=frontend-prod

  deploy:
    name: Deploy na server
    runs-on: ubuntu-latest
    needs:
      - determine-context
      - build-backend-image
      - build-frontend-image
    permissions:
      contents: read
    concurrency:
      group: deploy-${{ needs.determine-context.outputs.branch_tag }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.determine-context.outputs.head_sha }}

      - name: Příprava SSH klíče
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets[format('{0}_SERVER_SSH_PRIVATE_KEY', needs.determine-context.outputs.secret_prefix)] }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets[format('{0}_SERVER_SSH_KNOWN_HOSTS', needs.determine-context.outputs.secret_prefix)] }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Příprava deploy bundle
        shell: bash
        run: |
          mkdir -p .deploy
          cp docker-compose.yml .deploy/docker-compose.yml
          cp docker-compose.prod.yml .deploy/docker-compose.prod.yml
          cp scripts/remote_deploy.sh .deploy/remote_deploy.sh
          chmod +x .deploy/remote_deploy.sh
          printf '%s' "${{ secrets[format('{0}_SERVER_ENV_FILE', needs.determine-context.outputs.secret_prefix)] }}" > .deploy/.env.prod

      - name: Nahrání souborů na server
        shell: bash
        env:
          SERVER_HOST: ${{ secrets[format('{0}_SERVER_SSH_HOST', needs.determine-context.outputs.secret_prefix)] }}
          SERVER_PORT: ${{ secrets[format('{0}_SERVER_SSH_PORT', needs.determine-context.outputs.secret_prefix)] }}
          SERVER_USER: ${{ secrets[format('{0}_SERVER_SSH_USER', needs.determine-context.outputs.secret_prefix)] }}
          SERVER_PATH: ${{ secrets[format('{0}_SERVER_PATH', needs.determine-context.outputs.secret_prefix)] }}
        run: |
          ssh -p "${SERVER_PORT}" "${SERVER_USER}@${SERVER_HOST}" "mkdir -p '${SERVER_PATH}' '${SERVER_PATH}/scripts'"
          scp -P "${SERVER_PORT}" .deploy/docker-compose.yml "${SERVER_USER}@${SERVER_HOST}:${SERVER_PATH}/docker-compose.yml"
          scp -P "${SERVER_PORT}" .deploy/docker-compose.prod.yml "${SERVER_USER}@${SERVER_HOST}:${SERVER_PATH}/docker-compose.prod.yml"
          scp -P "${SERVER_PORT}" .deploy/.env.prod "${SERVER_USER}@${SERVER_HOST}:${SERVER_PATH}/.env.prod"
          scp -P "${SERVER_PORT}" .deploy/remote_deploy.sh "${SERVER_USER}@${SERVER_HOST}:${SERVER_PATH}/scripts/remote_deploy.sh"
          ssh -p "${SERVER_PORT}" "${SERVER_USER}@${SERVER_HOST}" "chmod 755 '${SERVER_PATH}/scripts/remote_deploy.sh'"

      - name: Spuštění deploye
        shell: bash
        env:
          SERVER_HOST: ${{ secrets[format('{0}_SERVER_SSH_HOST', needs.determine-context.outputs.secret_prefix)] }}
          SERVER_PORT: ${{ secrets[format('{0}_SERVER_SSH_PORT', needs.determine-context.outputs.secret_prefix)] }}
          SERVER_USER: ${{ secrets[format('{0}_SERVER_SSH_USER', needs.determine-context.outputs.secret_prefix)] }}
          SERVER_PATH: ${{ secrets[format('{0}_SERVER_PATH', needs.determine-context.outputs.secret_prefix)] }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          IMAGE_TAG: ${{ needs.determine-context.outputs.image_tag }}
        run: |
          ssh -p "${SERVER_PORT}" "${SERVER_USER}@${SERVER_HOST}" \
            "cd '${SERVER_PATH}' && \
             export GHCR_USERNAME='${GHCR_USERNAME}' && \
             export GHCR_TOKEN='${GHCR_TOKEN}' && \
             export IMAGE_TAG='${IMAGE_TAG}' && \
             bash scripts/remote_deploy.sh '${SERVER_PATH}' '.env.prod' 'docker-compose.yml:docker-compose.prod.yml'"
